name: Verify RescueLoop
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rescueloop
          POSTGRES_PASSWORD: rescueloop
          POSTGRES_DB: rescueloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rescueloop -d rescueloop_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen --python 3.12
        working-directory: services/backend
      - run: uv run alembic upgrade head
        working-directory: services/backend
        env:
          DATABASE_URL: postgresql+psycopg://rescueloop:rescueloop@127.0.0.1:5432/rescueloop_test
      - run: uv run pytest -q
        working-directory: services/backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://rescueloop:rescueloop@127.0.0.1:5432/rescueloop_test
      - run: npm run build
      - run: services/backend/.venv/bin/python scripts/export_contracts.py && npm run contracts && git diff --exit-code -- packages/contracts/openapi.json packages/contracts/api.generated.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
