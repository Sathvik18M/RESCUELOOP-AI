services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rescueloop
      POSTGRES_PASSWORD: rescueloop
      POSTGRES_DB: rescueloop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rescueloop_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescueloop -d rescueloop"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  rescueloop_data:
