# Free demo backend. Dashboard: Vercel Hobby. Database: existing Supabase.
# The API and worker share this instance; both sleep when Render spins down.
# No paid worker, paid database, disk, or upgrade is requested by this Blueprint.
services:
  - type: web
    name: rescueloop-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./infra/Dockerfile.backend
    dockerContext: .
    dockerCommand: python -m app.hosted
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: staging
      - key: DEMO_MODE
        value: "false"
      - key: AI_MODE
        value: groq
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: evidence
      - key: WHATSAPP_PROVIDER
        value: 360dialog_sandbox
      - key: WHATSAPP_MERCHANT_ID
        value: SELLER001
      - key: D360_API_KEY
        sync: false
      - key: D360_SANDBOX_RECIPIENT
        sync: false
      - key: D360_RECIPIENT_TYPE
        sync: false
      - key: D360_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
